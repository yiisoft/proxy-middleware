name: static analysis

on:
  pull_request:
    paths: &paths
      - '.github/workflows/static.yml'
      - 'src/**'
      - 'psalm.xml'
      - 'psalm80.xml'
      - 'psalm81-82.xml'
      - 'composer.json'
  push:
    branches: ['master']
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psalm80:
    uses: yiisoft/actions/.github/workflows/psalm.yml@master
    with:
      psalm-config: psalm80.xml
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.0']
  psalm81-82:
    uses: yiisoft/actions/.github/workflows/psalm.yml@master
    with:
      psalm-config: psalm81-82.xml
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.1', '8.2']
  psalm:
    uses: yiisoft/actions/.github/workflows/psalm.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.3', '8.4']
